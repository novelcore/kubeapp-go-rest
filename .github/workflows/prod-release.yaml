name: 🚀 Production Release & Deploy 🚀

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    # paths-ignore:
    #   - '**.md'
    #   - '.github/**'
    #   - '!.github/workflows/**'

env:
  KUBECORE_REGISTRY: ${{ vars.KUBECORE_REGISTRY }}
  KUBECORE_REGISTRY_UNAME: ${{ secrets.KUBECORE_REGISTRY_UNAME }}
  KUBECORE_REGISTRY_PWD: ${{ secrets.KUBECORE_REGISTRY_PWD }}
  KUBECORE_KUBEPROJECT_REPO: ${{ vars.KUBECORE_KUBEPROJECT_REPO }}
  APP_NAME: ${{ github.event.repository.name }}
  SHORT_SHA: ${{ github.sha }}

jobs:
  # Only run if PR was merged and came from an RC branch
  check-release-eligibility:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'rc/v')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      semantic_version: ${{ steps.extract-version.outputs.semantic_version }}
      previous_version: ${{ steps.get-previous-version.outputs.previous_version }}
      rc_base_commit: ${{ steps.get-rc-info.outputs.rc_base_commit }}
    steps:
      - name: Check release eligibility
        id: check
        run: |
          echo "PR was merged from RC branch: ${{ github.event.pull_request.head.ref }}"
          echo "should_release=true" >> $GITHUB_OUTPUT
      
      - name: Extract semantic version
        id: extract-version
        run: |
          # Extract version from RC branch name (rc/vX.Y.Z → X.Y.Z)
          RC_BRANCH="${{ github.event.pull_request.head.ref }}"
          SEMANTIC_VERSION=$(echo "$RC_BRANCH" | sed -E 's/rc\/v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          
          echo "RC branch: $RC_BRANCH"
          echo "Extracted version: $SEMANTIC_VERSION"
          echo "semantic_version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      
      - name: Get RC branch information
        id: get-rc-info
        run: |
          RC_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          # Get the commit where RC branch was created from dev
          RC_BASE_COMMIT=$(git merge-base origin/dev origin/$RC_BRANCH)
          echo "RC branched from dev at commit: $RC_BASE_COMMIT"
          echo "rc_base_commit=$RC_BASE_COMMIT" >> $GITHUB_OUTPUT
      
      - name: Get previous production version
        id: get-previous-version
        run: |
          # Fetch all tags
          git fetch --tags --force
          
          # Get all production tags (excluding RC tags)
          PROD_TAGS=$(git tag -l "v*" | grep -v "\-rc" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V)
          
          if [ -z "$PROD_TAGS" ]; then
            echo "No previous production tags found"
            echo "previous_version=" >> $GITHUB_OUTPUT
          else
            PREVIOUS_VERSION=$(echo "$PROD_TAGS" | tail -n 1)
            echo "Previous production version: $PREVIOUS_VERSION"
            echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          fi
  # Create production tag
  create-production-tag:
    needs: check-release-eligibility
    if: needs.check-release-eligibility.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      production_tag: ${{ steps.create-tag.outputs.production_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      
      - name: Create production tag
        id: create-tag
        run: |
          SEMANTIC_VERSION="${{ needs.check-release-eligibility.outputs.semantic_version }}"
          PRODUCTION_TAG="v${SEMANTIC_VERSION}"
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Create annotated tag
          git tag -a "${PRODUCTION_TAG}" -m "Production release ${PRODUCTION_TAG}"
          git push origin "${PRODUCTION_TAG}"
          
          echo "Created production tag: ${PRODUCTION_TAG}"
          echo "production_tag=${PRODUCTION_TAG}" >> $GITHUB_OUTPUT
  # Build production image
  build-production-image:
    needs: [check-release-eligibility, create-production-tag]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}
      full_image_name: ${{ steps.set-image-tag.outputs.full_image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set image tag
        id: set-image-tag
        run: |
          # KUBECORE_REGISTRY already contains full repository path
          # Extract registry host for docker login
          REGISTRY_HOST=$(echo "${{ env.KUBECORE_REGISTRY }}" | cut -d'/' -f1)
          echo "REGISTRY_HOST=${REGISTRY_HOST}" >> $GITHUB_ENV

          PRODUCTION_TAG="${{ needs.create-production-tag.outputs.production_tag }}"
          IMAGE_TAG="${PRODUCTION_TAG}"
          FULL_IMAGE_NAME="${{ env.KUBECORE_REGISTRY }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full_image_name=${FULL_IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Production image tag: ${IMAGE_TAG}"
          echo "Full image name: ${FULL_IMAGE_NAME}"
      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.KUBECORE_REGISTRY_UNAME }}
          password: ${{ env.KUBECORE_REGISTRY_PWD }}
          ecr: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.set-image-tag.outputs.full_image_name }}
            ${{ env.KUBECORE_REGISTRY }}:latest
          provenance: false
          build-args: |
            REGISTRY_URL=${{ env.KUBECORE_REGISTRY }}
            KUBECORE_KUBEPROJECT_REPO=${{ env.KUBECORE_KUBEPROJECT_REPO }}
            VERSION=${{ steps.set-image-tag.outputs.image_tag }}
  # Generate changelog
  generate-changelog:
    needs: [check-release-eligibility, create-production-tag]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.generate.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          
      - name: Generate token
        id: create_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.KUBECORE_APP_ID }}
          private_key: ${{ secrets.KUBECORE_APP_PKEY }}
      
      - name: Generate changelog
        id: generate
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          script: |
            const { execSync } = require('child_process');
            
            const currentTag = '${{ needs.create-production-tag.outputs.production_tag }}';
            const previousTag = '${{ needs.check-release-eligibility.outputs.previous_version }}';
            const rcBranch = '${{ github.event.pull_request.head.ref }}';
            const rcBaseCommit = '${{ needs.check-release-eligibility.outputs.rc_base_commit }}';
            
            console.log(`Generating changelog from ${previousTag || 'beginning'} to ${currentTag}`);
            console.log(`RC Branch: ${rcBranch}`);
            console.log(`RC Base Commit: ${rcBaseCommit}`);
            
            // Initialize categories
            const categories = {
              breaking: [],
              features: [],
              fixes: [],
              docs: [],
              maintenance: [],
              other: []
            };
            
            // Track RC information
            let rcInfo = {
              branch: rcBranch,
              iterations: [],
              devPRs: []
            };
            
            // Get RC tags for this version
            const rcVersion = rcBranch.replace('rc/', '');
            const rcTags = execSync(`git tag -l "${rcVersion}-rc*" | sort -V`).toString().trim().split('\n').filter(Boolean);
            console.log(`Found RC tags: ${rcTags.join(', ')}`);
            
            // Store RC iterations
            rcInfo.iterations = rcTags.map(tag => {
              const tagDate = execSync(`git log -1 --format=%aI ${tag}`).toString().trim();
              const tagMessage = execSync(`git log -1 --format=%B ${tag}`).toString().trim();
              return { tag, date: tagDate, message: tagMessage };
            });
            
            // Get all commits between the previous release and the RC base commit
            let commitRange = '';
            if (previousTag) {
              commitRange = `${previousTag}..${rcBaseCommit}`;
            } else {
              commitRange = `${rcBaseCommit}`;
            }
            
            console.log(`Looking for commits in range: ${commitRange}`);
            
            // Get all commits that were included in the RC (and thus in this release)
            const commits = execSync(`git rev-list ${commitRange}`).toString().trim().split('\n').filter(Boolean);
            console.log(`Found ${commits.length} commits in the release range`);
            
            // For each commit, find the associated PR
            const processedPRs = new Set();
            
            for (const commit of commits) {
              try {
                // Get commit message to check for PR merge patterns
                const commitMessage = execSync(`git log -1 --format=%B ${commit}`).toString().trim();
                console.log(`Processing commit ${commit.substring(0, 7)}: ${commitMessage.split('\n')[0]}`);
                
                // Look for merge commit patterns: "Merge pull request #123 from..."
                const mergeMatch = commitMessage.match(/Merge pull request #(\d+) from (.+)/);
                if (mergeMatch) {
                  const prNumber = parseInt(mergeMatch[1]);
                  const sourceBranch = mergeMatch[2];
                  
                  if (processedPRs.has(prNumber)) {
                    console.log(`Already processed PR #${prNumber}, skipping`);
                    continue;
                  }
                  
                  processedPRs.add(prNumber);
                  
                  try {
                    // Get PR details
                    const pr = await github.rest.pulls.get({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: prNumber
                    });
                    
                    const prData = {
                      number: prNumber,
                      title: pr.data.title,
                      author: pr.data.user.login,
                      branch: pr.data.head.ref,
                      mergeCommit: commit.substring(0, 7),
                      mergedAt: pr.data.merged_at,
                      body: pr.data.body || ''
                    };
                    
                    console.log(`Found PR #${prNumber}: ${prData.title} from ${prData.branch}`);
                    
                    // Get commits in the PR for multi-commit PRs
                    const prCommits = await github.paginate(github.rest.pulls.listCommits, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: prNumber,
                      per_page: 100
                    });
                    
                    // Format PR entry
                    let prEntry = `* **${prData.title}** (#${prData.number}) by @${prData.author}\n`;
                    
                    if (prCommits.length > 1) {
                      prCommits.forEach(commit => {
                        const message = commit.commit.message.split('\n')[0];
                        prEntry += `  - ${message} (${commit.sha.substring(0, 7)})\n`;
                      });
                    }
                    
                    // Categorize based on branch prefix
                    const branchLower = prData.branch.toLowerCase();
                    let categorized = false;
                    
                    if (branchLower.startsWith('breaking/')) {
                      categories.breaking.push(prEntry);
                      categorized = true;
                    } else if (branchLower.startsWith('feature/')) {
                      categories.features.push(prEntry);
                      categorized = true;
                    } else if (branchLower.startsWith('bug/') || branchLower.startsWith('bugfix/')) {
                      categories.fixes.push(prEntry);
                      categorized = true;
                    } else if (branchLower.startsWith('docs/')) {
                      categories.docs.push(prEntry);
                      categorized = true;
                    } else if (branchLower.startsWith('chore/') || branchLower.startsWith('maintenance/')) {
                      categories.maintenance.push(prEntry);
                      categorized = true;
                    }
                    
                    // If not categorized by branch, check PR title and body
                    if (!categorized) {
                      const combinedText = `${prData.title} ${prData.body}`.toLowerCase();
                      
                      if (combinedText.includes('breaking')) {
                        categories.breaking.push(prEntry);
                      } else if (combinedText.match(/\b(feat|feature|add|implement|create|introduce|enable)\b/)) {
                        categories.features.push(prEntry);
                      } else if (combinedText.match(/\b(fix|bugfix|resolve|patch|correct)\b/)) {
                        categories.fixes.push(prEntry);
                      } else if (combinedText.match(/\b(docs|documentation|readme)\b/)) {
                        categories.docs.push(prEntry);
                      } else if (combinedText.match(/\b(chore|maintenance|update|upgrade|deps|dependencies|ci|workflow)\b/)) {
                        categories.maintenance.push(prEntry);
                      } else {
                        categories.other.push(prEntry);
                      }
                    }
                    
                    rcInfo.devPRs.push(prData);
                  } catch (prError) {
                    console.log(`Could not fetch PR #${prNumber}: ${prError.message}`);
                  }
                }
              } catch (commitError) {
                console.log(`Error processing commit ${commit}: ${commitError.message}`);
              }
            }
            
            console.log(`Processed ${rcInfo.devPRs.length} PRs total`);
            
            // Build the changelog
            let changelog = `# Changelog for ${currentTag}\n\n`;
            changelog += `**Release Date:** ${new Date().toUTCString()}\n\n`;
            
            // Add release lifecycle section
            changelog += `## 🔄 Release Lifecycle\n\n`;
            changelog += `This release was created through the following process:\n\n`;
            changelog += `1. **Development Phase**: ${rcInfo.devPRs.length} PRs merged to \`dev\` branch\n`;
            changelog += `2. **Release Candidate**: Branch \`${rcBranch}\` created from \`dev\`\n`;
            if (rcInfo.iterations.length > 0) {
              changelog += `3. **RC Iterations**: ${rcInfo.iterations.length} release candidate(s)\n`;
              rcInfo.iterations.forEach((iter, idx) => {
                changelog += `   - ${iter.tag} (${new Date(iter.date).toLocaleDateString()})\n`;
              });
            }
            changelog += `4. **Production Release**: RC merged to \`main\` as ${currentTag}\n\n`;
            
            // Add categorized sections
            if (categories.breaking.length > 0) {
              changelog += `## 🚨 Breaking Changes\n\n${categories.breaking.join('\n')}\n`;
            }
            
            if (categories.features.length > 0) {
              changelog += `## ✨ New Features\n\n${categories.features.join('\n')}\n`;
            }
            
            if (categories.fixes.length > 0) {
              changelog += `## 🐛 Bug Fixes\n\n${categories.fixes.join('\n')}\n`;
            }
            
            if (categories.docs.length > 0) {
              changelog += `## 📚 Documentation\n\n${categories.docs.join('\n')}\n`;
            }
            
            if (categories.maintenance.length > 0) {
              changelog += `## 🔧 Maintenance\n\n${categories.maintenance.join('\n')}\n`;
            }
            
            if (categories.other.length > 0) {
              changelog += `## 📝 Other Changes\n\n${categories.other.join('\n')}\n`;
            }
            
            // Add release information
            changelog += `\n## 📋 Release Information\n\n`;
            changelog += `* **Release PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}\n`;
            changelog += `* **RC Branch**: \`${rcBranch}\`\n`;
            changelog += `* **Released by**: @${{ github.event.pull_request.merged_by.login }}\n`;
            
            // Add timeline
            changelog += `\n## 📅 Release Timeline\n\n`;
            if (rcInfo.devPRs.length > 0) {
              const sortedPRs = rcInfo.devPRs.sort((a, b) => new Date(a.mergedAt) - new Date(b.mergedAt));
              changelog += `* **First PR merged**: ${new Date(sortedPRs[0].mergedAt).toLocaleDateString()} (#${sortedPRs[0].number})\n`;
              changelog += `* **Last PR merged**: ${new Date(sortedPRs[sortedPRs.length - 1].mergedAt).toLocaleDateString()} (#${sortedPRs[sortedPRs.length - 1].number})\n`;
            }
            if (rcInfo.iterations.length > 0) {
              changelog += `* **RC created**: ${new Date(rcInfo.iterations[0].date).toLocaleDateString()}\n`;
              if (rcInfo.iterations.length > 1) {
                changelog += `* **Final RC**: ${rcInfo.iterations[rcInfo.iterations.length - 1].tag} on ${new Date(rcInfo.iterations[rcInfo.iterations.length - 1].date).toLocaleDateString()}\n`;
              }
            }
            changelog += `* **Released**: ${new Date().toLocaleDateString()}\n`;
            
            // Add statistics
            const totalPRs = Object.values(categories).reduce((sum, cat) => sum + cat.length, 0);
            changelog += `\n## 📊 Statistics\n\n`;
            changelog += `* **Total PRs included**: ${totalPRs}\n`;
            changelog += `* **RC iterations**: ${rcInfo.iterations.length}\n`;
            
            if (categories.features.length > 0) {
              changelog += `* **Features**: ${categories.features.length}\n`;
            }
            if (categories.fixes.length > 0) {
              changelog += `* **Bug fixes**: ${categories.fixes.length}\n`;
            }
            if (categories.breaking.length > 0) {
              changelog += `* **Breaking changes**: ${categories.breaking.length}\n`;
            }
            if (categories.docs.length > 0) {
              changelog += `* **Documentation**: ${categories.docs.length}\n`;
            }
            if (categories.maintenance.length > 0) {
              changelog += `* **Maintenance**: ${categories.maintenance.length}\n`;
            }
            
            // Add contributors section
            const contributors = [...new Set(rcInfo.devPRs.map(pr => pr.author))];
            if (contributors.length > 0) {
              changelog += `\n## 👥 Contributors\n\n`;
              changelog += contributors.map(c => `* @${c}`).join('\n');
              changelog += '\n';
            }
            
            // Save to file
            const fs = require('fs');
            fs.writeFileSync('CHANGELOG.md', changelog);
            
            // Set output - properly escape for JSON
            const escapedChangelog = changelog.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
            core.setOutput('changelog', escapedChangelog);
      
  # Notify GitOps repository
  notify-gitops-repository:
    needs: [check-release-eligibility, create-production-tag, build-production-image]
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: create_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.KUBECORE_APP_ID }}
          private_key: ${{ secrets.KUBECORE_APP_PKEY }}

      - name: Dispatch Production Environment Update Event
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ steps.create_token.outputs.token }}
          event-type: production-environment-update
          repository: ${{ github.repository_owner }}/${{ env.KUBECORE_KUBEPROJECT_REPO }}
          client-payload: >-
            {
              "version": "${{ needs.build-production-image.outputs.image_tag }}",
              "image": "${{ needs.build-production-image.outputs.full_image_name }}",
              "app_name": "${{ env.APP_NAME }}",
              "semantic_version": "${{ needs.create-production-tag.outputs.production_tag }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "merged_by": "${{ github.event.pull_request.merged_by.login }}",
              "plain_image_name": "${{ env.KUBECORE_REGISTRY }}"
            }
  # Create GitHub release
  create-github-release:
    needs: [check-release-eligibility, create-production-tag, build-production-image, generate-changelog, notify-gitops-repository]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the escaped changelog and unescape it
            const escapedChangelog = "${{ needs.generate-changelog.outputs.changelog }}";
            const changelog = escapedChangelog.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
            
            try {
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: '${{ needs.create-production-tag.outputs.production_tag }}',
                name: 'Release ${{ needs.create-production-tag.outputs.production_tag }}',
                body: changelog,
                draft: false,
                prerelease: false
              });
              
              console.log(`Created release: ${release.data.html_url}`);
              
              // Add release URL to summary
              const fs = require('fs');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## 📦 GitHub Release\n[View Release](${release.data.html_url})\n`);
            } catch (error) {
              console.error('Error creating release:', error);
              // Don't fail the workflow
            }
  # Sync changes back to dev
  sync-to-dev:
    needs: [check-release-eligibility, create-production-tag, create-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate token
        id: create_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.KUBECORE_APP_ID }}
          private_key: ${{ secrets.KUBECORE_APP_PKEY }}
      
      - name: Check if sync is needed
        id: check-sync
        run: |
          echo "📡 Fetching latest from remote..."
          git fetch --all --prune
          
          RC_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "RC Branch: $RC_BRANCH"
          
          # Set up local tracking branches for comparison
          git checkout -B dev origin/dev 2>/dev/null || echo "Dev branch already exists locally"
          git checkout -B "$RC_BRANCH" "origin/$RC_BRANCH" 2>/dev/null || echo "RC branch already exists locally"
          
          # Show current branch status
          echo "📊 Branch information:"
          echo "Available local branches:"
          git branch | grep -E "(dev|$RC_BRANCH)" || echo "No matching branches found"
          echo "Available remote branches:"
          git branch -r | grep -E "(dev|$RC_BRANCH)" || echo "No matching remote branches found"
          
          # Check if RC branch has changes compared to dev (dev..RC_BRANCH shows what RC has that dev doesn't)
          BEHIND_COUNT=$(git rev-list --count "dev..$RC_BRANCH" 2>/dev/null || echo "0")
          AHEAD_COUNT=$(git rev-list --count "$RC_BRANCH..dev" 2>/dev/null || echo "0")
          
          echo "📈 Comparison: dev vs $RC_BRANCH"
          echo "Dev is $BEHIND_COUNT commits behind RC branch (commits RC has that dev doesn't)"
          echo "Dev is $AHEAD_COUNT commits ahead of RC branch (commits dev has that RC doesn't)"
          
          # Show some actual commit differences for debugging
          echo "📝 Recent commits in RC that are not in dev:"
          git log --oneline "dev..$RC_BRANCH" | head -5 || echo "No unique commits in RC"
          
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "✅ Sync needed: Dev is behind RC branch by $BEHIND_COUNT commits"
            echo "sync_needed=true" >> $GITHUB_OUTPUT
            echo "rc_branch=$RC_BRANCH" >> $GITHUB_OUTPUT
            echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No sync needed: Dev is up to date with RC branch"
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create sync PR to dev
        if: steps.check-sync.outputs.sync_needed == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          script: |
            const productionTag = '${{ needs.create-production-tag.outputs.production_tag }}';
            const rcBranch = '${{ steps.check-sync.outputs.rc_branch }}';
            const behindCount = '${{ steps.check-sync.outputs.behind_count }}';
            
            console.log(`Creating sync PR for ${rcBranch} -> dev (${behindCount} commits behind)`);
            
            try {
              // Check if PR already exists
              const { data: existingPRs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${rcBranch}`,
                base: 'dev',
                state: 'open'
              });
              
              if (existingPRs.length > 0) {
                console.log(`✅ Sync PR already exists: ${existingPRs[0].html_url}`);
                
                // Update the existing PR with current information
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: existingPRs[0].number,
                  title: `🔄 Sync RC changes from ${productionTag} to dev`,
                  body: `## Release Candidate Sync
                  
                  This PR syncs changes from the RC branch \`${rcBranch}\` back to the \`dev\` branch.
                  
                  ### Release Information
                  - **Version**: \`${productionTag}\`
                  - **RC Branch**: \`${rcBranch}\`
                  - **Changes**: ${behindCount} commits to sync
                  - **Original PR**: #${{ github.event.pull_request.number }}
                  - **Released by**: @${{ github.event.pull_request.merged_by.login }}
                  
                  ### Why is this needed?
                  This ensures that the \`dev\` branch includes all changes that were made during the RC stabilization process.
                  These changes came directly from the RC branch rather than main to maintain the exact state of the stabilized code.
                  
                  ⚠️ **Important**: This PR should be merged promptly to keep the branches in sync.
                  
                  _Updated automatically after production release._`
                });
                
                return;
              }
              
              // Create new PR to sync RC branch to dev
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔄 Sync RC changes from ${productionTag} to dev`,
                body: `## Release Candidate Sync
                
                This PR syncs changes from the RC branch \`${rcBranch}\` back to the \`dev\` branch.
                
                ### Release Information
                - **Version**: \`${productionTag}\`
                - **RC Branch**: \`${rcBranch}\`
                - **Changes**: ${behindCount} commits to sync
                - **Original PR**: #${{ github.event.pull_request.number }}
                - **Released by**: @${{ github.event.pull_request.merged_by.login }}
                
                ### Why is this needed?
                This ensures that the \`dev\` branch includes all changes that were made during the RC stabilization process.
                These changes came directly from the RC branch rather than main to maintain the exact state of the stabilized code.
                
                ⚠️ **Important**: This PR should be merged promptly to keep the branches in sync.`,
                head: rcBranch,
                base: 'dev',
                maintainer_can_modify: true
              });
              
              console.log(`✅ Created sync PR: ${pr.data.html_url}`);
              
              // Add labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.data.number,
                labels: ['sync', 'automated', 'rc-sync']
              });
              
              // Try to auto-merge if possible (requires appropriate permissions)
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.data.number,
                  merge_method: 'merge',
                  commit_title: `Sync RC changes from ${productionTag} to dev`,
                  commit_message: `Automatically syncing ${behindCount} commits from RC branch ${rcBranch} back to dev branch after production release.`
                });
                console.log('✅ Auto-merged sync PR');
              } catch (mergeError) {
                console.log(`ℹ️ Could not auto-merge: ${mergeError.message}`);
                console.log('Manual approval/merge required');
              }
            } catch (error) {
              console.error('❌ Error creating sync PR:', error);
              throw error; // Re-throw to fail the step if there's a real error
            }
      
      - name: Debug sync status
        if: always()
        run: |
          echo "🔍 Final sync status check:"
          echo "Sync needed: ${{ steps.check-sync.outputs.sync_needed }}"
          echo "RC branch: ${{ steps.check-sync.outputs.rc_branch }}"
          echo "Behind count: ${{ steps.check-sync.outputs.behind_count }}"
          
          if [ "${{ steps.check-sync.outputs.sync_needed }}" != "true" ]; then
            echo "ℹ️ No sync operation will be performed"
          fi
  # Final summary
  release-summary:
    needs: [check-release-eligibility, create-production-tag, build-production-image, generate-changelog, notify-gitops-repository, create-github-release, sync-to-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "# 🚀 Production Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ needs.create-production-tag.outputs.production_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.build-production-image.outputs.full_image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Merged by**: @${{ github.event.pull_request.merged_by.login }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production image built and pushed" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitOps repository notified for production deployment" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub release created with changelog" >> $GITHUB_STEP_SUMMARY
          
          # Check sync status
          SYNC_STATUS="${{ needs.sync-to-dev.result }}"
          if [ "$SYNC_STATUS" = "success" ]; then
            echo "✅ Dev branch sync completed" >> $GITHUB_STEP_SUMMARY
          elif [ "$SYNC_STATUS" = "skipped" ]; then
            echo "⏭️ Dev branch sync skipped (not needed or branches missing)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Dev branch sync had issues (check logs)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Monitor the production deployment in ArgoCD" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify the application is working correctly" >> $GITHUB_STEP_SUMMARY
          echo "3. Ensure the dev sync PR is merged (if created)" >> $GITHUB_STEP_SUMMARY
      
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const syncStatus = '${{ needs.sync-to-dev.result }}';
            let syncMessage = '';
            
            if (syncStatus === 'success') {
              syncMessage = '- ✅ **Sync**: Dev branch synchronization completed';
            } else if (syncStatus === 'skipped') {
              syncMessage = '- ⏭️ **Sync**: Dev branch sync skipped (not needed or branches missing)';
            } else {
              syncMessage = '- ⚠️ **Sync**: Dev branch synchronization had issues (check workflow logs)';
            }
            
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎉 Production Release Completed!
              
              The production release has been successfully processed:
              
              - ✅ **Version**: \`${{ needs.create-production-tag.outputs.production_tag }}\`
              - ✅ **Image**: \`${{ needs.build-production-image.outputs.full_image_name }}\`
              - ✅ **Deployment**: GitOps repository updated for production
              - ✅ **Release**: GitHub release created with changelog
              ${syncMessage}
              
              The production deployment will be handled by ArgoCD according to your GitOps configuration.`
            })