name: 🧹 Cleanup Stale Branches

on:
  schedule:
    # Run every day at midnight
    - cron: '0 0 * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:

env:
  STALE_DAYS: 7  # Consider branches stale after 7 days

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Generate GitHub App token
        id: create_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.KUBECORE_APP_ID }}
          private_key: ${{ secrets.KUBECORE_APP_PKEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.create_token.outputs.token }}

      - name: Cleanup stale branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          script: |
            const staleDays = process.env.STALE_DAYS || 7;
            const staleThreshold = new Date();
            staleThreshold.setDate(staleThreshold.getDate() - staleDays);
            
            // Branch patterns to check
            const branchPatterns = [
              '^feature/',
              '^bugfix/',
              '^bug/',
              '^chore/',
              '^maintenance/',
              '^rc/v'
            ];
            
            // Get all branches
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const protectedBranches = ['main', 'dev', 'master'];
            const deletedBranches = [];
            const skippedBranches = [];
            const errors = [];
            
            for (const branch of branches) {
              try {
                // Skip protected branches
                if (protectedBranches.includes(branch.name)) {
                  skippedBranches.push({ name: branch.name, reason: 'Protected branch' });
                  continue;
                }
                
                // Check if branch matches any of our patterns
                const matchesPattern = branchPatterns.some(pattern => 
                  new RegExp(pattern).test(branch.name)
                );
                
                if (!matchesPattern) {
                  skippedBranches.push({ name: branch.name, reason: 'Does not match cleanup patterns' });
                  continue;
                }
                
                // Get the latest commit for this branch
                const { data: commit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: branch.commit.sha
                });
                
                const lastCommitDate = new Date(commit.commit.committer.date);
                
                // Check if branch is stale
                if (lastCommitDate < staleThreshold) {
                  // Check if branch has open PRs
                  const { data: prs } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    head: `${context.repo.owner}:${branch.name}`,
                    state: 'open'
                  });
                  
                  if (prs.length > 0) {
                    skippedBranches.push({ 
                      name: branch.name, 
                      reason: `Has ${prs.length} open PR(s)`,
                      prs: prs.map(pr => `#${pr.number}`)
                    });
                    continue;
                  }
                  
                  // Delete the branch
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch.name}`
                  });
                  
                  deletedBranches.push({
                    name: branch.name,
                    lastCommit: lastCommitDate.toISOString(),
                    daysStale: Math.floor((staleThreshold - lastCommitDate) / (1000 * 60 * 60 * 24))
                  });
                } else {
                  skippedBranches.push({ 
                    name: branch.name, 
                    reason: 'Not stale yet',
                    lastCommit: lastCommitDate.toISOString()
                  });
                }
              } catch (error) {
                errors.push({ branch: branch.name, error: error.message });
                console.error(`Error processing branch ${branch.name}:`, error);
              }
            }
            
            // Create a summary issue if any branches were deleted
            if (deletedBranches.length > 0) {
              const summaryBody = `## 🧹 Branch Cleanup Summary
              
              ${new Date().toISOString().split('T')[0]}
              
              ### Deleted Branches (${deletedBranches.length})
              ${deletedBranches.map(b => `- \`${b.name}\` (${b.daysStale} days stale, last commit: ${b.lastCommit})`).join('\n')}
              
              ### Skipped Branches (${skippedBranches.length})
              ${skippedBranches.map(b => {
                let line = `- \`${b.name}\` (${b.reason})`;
                if (b.lastCommit) line += ` - Last commit: ${b.lastCommit}`;
                if (b.prs) line += ` - Open PRs: ${b.prs.join(', ')}`;
                return line;
              }).join('\n')}
              
              ${errors.length > 0 ? `### Errors (${errors.length})
              ${errors.map(e => `- \`${e.branch}\`: ${e.error}`).join('\n')}` : ''}
              
              > This is an automated cleanup of stale branches (${staleDays}+ days old).`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🧹 Branch Cleanup Report - ${new Date().toISOString().split('T')[0]}`,
                body: summaryBody,
                labels: ['maintenance', 'automated-cleanup']
              });
            }
            
            // Set step summary
            const summary = `## Branch Cleanup Results
            
            - Deleted: ${deletedBranches.length} branches
            - Skipped: ${skippedBranches.length} branches
            - Errors: ${errors.length}
            
            ${deletedBranches.length > 0 ? 'A detailed report has been created as an issue.' : ''}`;
            
            core.setOutput('deleted_count', deletedBranches.length);
            core.setOutput('skipped_count', skippedBranches.length);
            core.setOutput('error_count', errors.length);
            
            await core.summary
              .addRaw(summary)
              .write(); 