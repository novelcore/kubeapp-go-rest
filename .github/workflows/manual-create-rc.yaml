name: ❄️ Craft RC, release dev ▶️ stage ❄️

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Optional: Custom version to use instead of latest dev tag (e.g., 1.2.3)'
        required: false
        type: string

env:
  KUBECORE_KUBEPROJECT_REPO: ${{ vars.KUBECORE_KUBEPROJECT_REPO }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  create-rc-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      rc_branch: ${{ steps.create-rc.outputs.rc_branch }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "dev" ]]; then
            echo "❌ Error: This workflow can only be run from the 'dev' branch."
            echo "Current branch: ${{ github.ref_name }}"
            echo ""
            echo "Please switch to the 'dev' branch and run this workflow again."
            exit 1
          fi
          echo "✅ Running from dev branch"
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'  # Fetch all history and tags
          
      - name: Get latest dev version
        id: get-version
        run: |
          # Make sure to fetch all tags
          git fetch --tags --force
          
          # Check if a custom version was provided
          if [[ -n "${{ github.event.inputs.custom_version }}" ]]; then
            # Use the provided custom version
            CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
            # Ensure the version format is correct (remove 'v' prefix if provided)
            CLEAN_VERSION="${CUSTOM_VERSION#v}"
            echo "Using custom version: ${CLEAN_VERSION}"
            echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get all dev tags and extract version numbers from them
          DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
          
          # If no dev tags, check if there are any regular 'v' tags to extract versions from
          if [ -z "$DEV_TAGS" ]; then
            REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
            if [ -n "$REGULAR_TAGS" ]; then
              # Use the latest regular tag version
              LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
              echo "No dev tags found. Using version from regular tag: $LATEST_TAG"
            else
              # No tags at all, start with 0.0.0
              LATEST_TAG="v0.0.0"
              echo "No tags found. Starting with: $LATEST_TAG"
            fi
          else
            # Extract the semantic version from the latest dev tag
            LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
            LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
            echo "Latest version from dev tags: $LATEST_TAG"
          fi
          
          # Remove 'v' prefix for version output
          VERSION=${LATEST_TAG#v}
          echo "Using version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate token
        id: create_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.KUBECORE_APP_ID }}
          private_key: ${{ secrets.KUBECORE_APP_PKEY }}

      - name: Create RC branch
        id: create-rc
        uses: peterjgrainger/action-create-branch@v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.create_token.outputs.token }}
        with:
          branch: 'rc/v${{ steps.get-version.outputs.version }}'
          sha: '${{ github.sha }}'

      - name: Create PR to main
        id: create-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          script: |
            const rcBranch = 'rc/v${{ steps.get-version.outputs.version }}';
            const version = '${{ steps.get-version.outputs.version }}';
            
            // Create PR to main
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Release Candidate v${version} to Staging`,
              body: `## Release Candidate v${version}

              This PR represents the promotion of version ${version} to production.

              ### Deployment Gates:
              - [ ] Staging deployment successful
              - [ ] QA approval
              - [ ] Product approval

              ### Changes included:
              - Release candidate branch: ${rcBranch}
              - Base version: v${version}
              - Source branch: dev

              ### Deployment Status:
              The staging deployment status will be tracked here. Merging to main will be blocked until staging deployment is successful.`,
              head: rcBranch,
              base: 'main'
            });
            
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('pr_url', pr.html_url);

      - name: Summary
        run: |
          RC_BRANCH="rc/v${{ steps.get-version.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          echo "## 🏷️ Release Candidate Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A release candidate branch has been created:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch name**: \`${RC_BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch URL**: ${REPO_URL}/tree/${RC_BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "- **Based on version**: \`v${{ steps.get-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pull Request**: ${{ steps.create-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This branch can now be used for Release Candidate builds and promotion to staging." >> $GITHUB_STEP_SUMMARY