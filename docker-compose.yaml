x-logging: &default-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/api/prom/push'
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}\/\d{2}\/\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<time>\d{4}\/\d{2}\/\d{2} \d{1,2}:\d{2}:\d{2}) (?P<message>(?s:.*))$$'

version: "3.4"

services:
  loki:
    image: grafana/loki:2.8.3
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  app-a:
    build: ./app
    ports:
      - "8080:8080"
    depends_on:
      - loki
    environment:
      APP_NAME: "app-a"
      ZITADEL_OIDC: "${ZITADEL_OIDC:-false}"
      OBSERVABILITY: "${OBSERVABILITY:-false}"
      ZITADEL_DOMAIN: "${ZITADEL_DOMAIN:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      JWT_JWKS_URL: "${JWT_JWKS_URL:-}"
      OTLP_GRPC_ENDPOINT: "${OTLP_GRPC_ENDPOINT:-http://tempo:4317}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    logging: *default-logging

  app-b:
    build: ./app
    ports:
      - "8081:8080"
    depends_on:
      - loki
    environment:
      APP_NAME: "app-b"
      ZITADEL_OIDC: "${ZITADEL_OIDC:-false}"
      OBSERVABILITY: "${OBSERVABILITY:-false}"
      ZITADEL_DOMAIN: "${ZITADEL_DOMAIN:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      JWT_JWKS_URL: "${JWT_JWKS_URL:-}"
      OTLP_GRPC_ENDPOINT: "${OTLP_GRPC_ENDPOINT:-http://tempo:4317}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./etc/prometheus:/workspace
    command:
      - --config.file=/workspace/prometheus.yml
      - --enable-feature=exemplar-storage
    depends_on:
      - loki
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.1.1
    command: [ "--target=all", "--storage.trace.backend=local", "--storage.trace.local.path=/var/tempo", "--auth.enabled=false" ]
    ports:
      - "14250:14250"
    depends_on:
      - loki
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./etc/grafana/:/etc/grafana/provisioning/datasources
      - ./etc/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./etc/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    logging: *default-logging
